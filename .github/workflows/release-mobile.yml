# @format

name: Release Mobile App

on:
    push:
        branches:
            - main
        paths:
            - 'mobile/**'
            - '.github/workflows/release-mobile.yml'
        tags:
            - 'mobile@*'
    workflow_dispatch:

concurrency:
    group: public-mobile-release
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: write

jobs:
    release-mobile:
        name: Build & Publish Android (.apk)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Setup Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Build & Publish Mobile APK
              working-directory: mobile
              env:
                  CI: '1'
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG_NAME="mobile@${VERSION}"

                  npm install --legacy-peer-deps --no-audit --no-fund
                  npx expo prebuild --platform android --clean --no-install

                  cd android
                  chmod +x gradlew
                  NODE_ENV=production ./gradlew assembleRelease \
                      --no-daemon \
                      -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
                      -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

                  APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
                  if [ -z "$APK_PATH" ]; then
                      echo "::error::No release APK produced by Gradle"
                      exit 1
                  fi

                  mkdir -p ../release
                  OUT_APK="../release/Crea-Accent-Studio-Mobile-${VERSION}.apk"
                  cp "$APK_PATH" "$OUT_APK"

                  for i in 1 2 3 4; do
                    if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                      break
                    fi
                    gh release create "${TAG_NAME}" \
                      --repo "${{ github.repository }}" \
                      --target "${{ github.sha }}" \
                      --title "Mobile ${TAG_NAME}" \
                      --notes "Official Mobile release for Crea-Accent Studio (${TAG_NAME})." \
                      --draft=false \
                      --prerelease=false \
                      --latest=false >/dev/null 2>&1 || sleep 2
                  done

                  echo "Uploading ${OUT_APK} to ${TAG_NAME}..."
                  gh release upload "${TAG_NAME}" "${OUT_APK}" --repo "${{ github.repository }}" --clobber
