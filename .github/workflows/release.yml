# @format

name: Release Desktop

on:
    push:
        branches:
            - main
        tags:
            - 'desktop@*'
    workflow_dispatch:

concurrency:
    group: public-desktop-release
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: write

jobs:
    release-desktop:
        name: Build & Publish Desktop (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest, macos-14]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Build and Package Desktop
              run: pnpm run dist
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

            - name: Publish OS Installer to GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG_NAME="desktop@${VERSION}"

                  for i in 1 2 3 4; do
                    if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                      break
                    fi
                    gh release create "${TAG_NAME}" \
                      --repo "${{ github.repository }}" \
                      --target "${{ github.sha }}" \
                      --title "Desktop ${TAG_NAME}" \
                      --notes "Official Desktop release for Crea-Accent Studio (${TAG_NAME})." \
                      --draft=false \
                      --prerelease=false >/dev/null 2>&1 || sleep 2
                  done

                  shopt -s nullglob
                  FILES=(
                    release/*.exe
                    release/*.dmg
                    release/*.AppImage
                    release/latest*.yml
                    release/*.blockmap
                  )
                  if [ ${#FILES[@]} -eq 0 ]; then
                    echo "::error::No installer artifacts found in release/"
                    exit 1
                  fi
                  echo "Uploading ${#FILES[@]} asset(s) to ${TAG_NAME}..."
                  gh release upload "${TAG_NAME}" "${FILES[@]}" --repo "${{ github.repository }}" --clobber
