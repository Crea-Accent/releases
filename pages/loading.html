		(function initRippleLogo() {
			const canvas = document.getElementById('ripple-logo');
			if (!canvas) return;
			const ctx = canvas.getContext('2d');
			if (!ctx) return;

			const activeW = 460;
			const activeH = 236;
			const dpr = Math.max(2, Math.min(window.devicePixelRatio || 1, 3));
			canvas.width = Math.round(activeW * dpr);
			canvas.height = Math.round(activeH * dpr);

			const compiledFull = FULL_LOGO_PATHS.map((item) => ({
				tx: item.tx,
				ty: item.ty,
				path: new Path2D(item.d),
			}));

			const svgSpanX = FULL_LOGO_BOUNDS.maxX - FULL_LOGO_BOUNDS.minX;
			const svgSpanY = FULL_LOGO_BOUNDS.maxY - FULL_LOGO_BOUNDS.minY;
			const defaultAspect = svgSpanX / svgSpanY;

			const gridCols = 96;
			const gridRows = Math.max(12, Math.round(gridCols / defaultAspect));

			const padX = activeW * 0.04;
			const padY = activeH * 0.04;
			const drawW = activeW - padX * 2;
			const drawH = activeH - padY * 2;
			const cellStepX = drawW / gridCols;
			const cellStepY = drawH / gridRows;

			const SAMPLE_OFFSETS = [
				[0, 0],
				[-0.28, -0.28],
				[0.28, -0.28],
				[-0.28, 0.28],
				[0.28, 0.28],
			];

			function computeLogoCoverage(homeX, homeY) {
				let hits = 0;
				for (let s = 0; s < SAMPLE_OFFSETS.length; s++) {
					const px = homeX + SAMPLE_OFFSETS[s][0] * cellStepX;
					const py = homeY + SAMPLE_OFFSETS[s][1] * cellStepY;
					const lu = (px - padX) / drawW;
					const lv = (py - padY) / drawH;
					if (lu < 0 || lu > 1 || lv < 0 || lv > 1) continue;
					const svgX = FULL_LOGO_BOUNDS.minX + lu * svgSpanX;
					const svgY = FULL_LOGO_BOUNDS.minY + lv * svgSpanY;
					for (let i = 0; i < compiledFull.length; i++) {
						const item = compiledFull[i];
						if (ctx.isPointInPath(item.path, svgX - item.tx, svgY - item.ty, 'evenodd')) {
							hits++;
							break;
						}
					}
				}
				if (hits === 0) return 0;
				return Math.max(0.54, hits / SAMPLE_OFFSETS.length);
			}

			const dots = [];
			for (let r = 0; r < gridRows; r++) {
				for (let c = 0; c < gridCols; c++) {
					const u = (c + 0.5) / gridCols;
					const v = (r + 0.5) / gridRows;
					const homeX = padX + u * drawW;
					const homeY = padY + v * drawH;
					const cov = computeLogoCoverage(homeX, homeY);
					// Strictly keep only logo dots — skip all extra/ambient dots
					if (cov <= 0.26) continue;

					const nx = (u - 0.5) * 2;
					const ny = (v - 0.5) * 2;
					const distCenter = Math.hypot(nx, ny);
					const angle = Math.atan2(ny, nx);
					const scatter = 14 + distCenter * 20;

					dots.push({
						homeX,
						homeY,
						x: homeX + Math.cos(angle) * scatter,
						y: homeY + Math.sin(angle) * scatter + 10,
						vx: 0,
						vy: 0,
						nx,
						ny,
						distCenter,
						coverage: cov,
						phase: (c * 0.19 + r * 0.23) % (Math.PI * 2),
					});
				}
			}

			const cellRadiusBase = Math.min(cellStepX, cellStepY) * 0.38;
			const accentRgb = [164, 183, 149];
			const textRgb = [250, 250, 250];

			function renderFrame(now) {
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				ctx.clearRect(0, 0, activeW, activeH);

				const t = now * 0.001;

				for (let i = 0; i < dots.length; i++) {
					const d = dots[i];
					const waveDiag = Math.sin(d.nx * 5.2 - d.ny * 3.8 - t * 3.4);
					const waveRadial = Math.cos(d.distCenter * 6.4 - t * 2.8);
					const waveCombined = waveDiag * 0.65 + waveRadial * 0.35;
					const waveNorm = Math.pow((waveCombined + 1) * 0.5, 1.5);

					const floatScale = 1.9;
					const floatX = Math.cos(d.nx * 4.5 - d.ny * 2.5 - t * 3.1 + d.phase * 0.25) * 1.8 * floatScale;
					const floatY = Math.sin(d.nx * 4.8 - d.ny * 3.0 - t * 3.4 + d.phase * 0.25) * 2.9 * floatScale;

					const targetX = d.homeX + floatX;
					const targetY = d.homeY + floatY;

					d.vx += (targetX - d.x) * 0.11;
					d.vy += (targetY - d.y) * 0.11;
					d.vx *= 0.8;
					d.vy *= 0.8;
					d.x += d.vx;
					d.y += d.vy;

					const logoScaleFactor = 0.62 + waveNorm * 0.68;
					const radius = Math.max(0.65, cellRadiusBase * d.coverage * logoScaleFactor);

					const accentMix = Math.min(1, waveNorm * 0.92);
					const rCol = Math.round(textRgb[0] + (accentRgb[0] - textRgb[0]) * accentMix);
					const gCol = Math.round(textRgb[1] + (accentRgb[1] - textRgb[1]) * accentMix);
					const bCol = Math.round(textRgb[2] + (accentRgb[2] - textRgb[2]) * accentMix);
					const alpha = Math.min(1, 0.72 + waveNorm * 0.28);

					ctx.beginPath();
					ctx.arc(d.x, d.y, radius, 0, Math.PI * 2);
					ctx.fillStyle = `rgba(${rCol}, ${gCol}, ${bCol}, ${alpha.toFixed(3)})`;
					ctx.fill();
				}

				requestAnimationFrame(renderFrame);
			}

			requestAnimationFrame(renderFrame);
		})();
